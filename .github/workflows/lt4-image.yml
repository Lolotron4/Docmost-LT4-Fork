# LT4-Fork: baut das Docker-Image bei jedem Push und legt es in der GitHub Container Registry ab.
# Portainer lädt es dann nur noch herunter (siehe docs/lt4/schnelles-deployment.md).
name: LT4 Image

on:
  push:
    branches:
      - main
      - 'lt4/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lt4-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image-Name und Tag bestimmen
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME//\//-}"
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.tag }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.tag }}
