# LT4-Fork: baut den LT4-Docs Client (Tauri) für Windows, Linux, macOS und Android (APK).
# Die Dateien liegen danach unter "Actions" > Lauf > "Artifacts".
# Bei einem Tag "client-v*" (z. B. client-v0.1.0) entsteht zusätzlich ein Release-Entwurf.
# Anleitung: docs/lt4/client-app.md
name: LT4 Client-App

on:
  workflow_dispatch:
  push:
    tags:
      - 'client-v*'
    branches:
      - main
    paths:
      - 'apps/client-app/**'
      - 'packages/editor-ext/**'
      - '.github/workflows/lt4-client-app.yml'

permissions:
  contents: write

concurrency:
  group: lt4-client-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Pakete für WebKitGTK
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client-app/src-tauri -> target

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Editor-Bausteine bauen
        run: pnpm --filter @docmost/editor-ext build

      - name: Oberflächen-Tests
        working-directory: apps/client-app
        run: pnpm test

      - name: Rust-Tests
        working-directory: apps/client-app/src-tauri
        run: cargo test --lib

      - name: App bauen
        working-directory: apps/client-app
        run: pnpm tauri build

      - name: Dateien hochladen
        uses: actions/upload-artifact@v4
        with:
          name: lt4-docs-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/client-app/src-tauri/target/release/bundle/msi/*.msi
            apps/client-app/src-tauri/target/release/bundle/nsis/*.exe
            apps/client-app/src-tauri/target/release/bundle/deb/*.deb
            apps/client-app/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/client-app/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Release-Entwurf
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: LT4-Docs Client ${{ github.ref_name }}
          files: |
            apps/client-app/src-tauri/target/release/bundle/msi/*.msi
            apps/client-app/src-tauri/target/release/bundle/nsis/*.exe
            apps/client-app/src-tauri/target/release/bundle/deb/*.deb
            apps/client-app/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/client-app/src-tauri/target/release/bundle/dmg/*.dmg

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS: 35.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Android-SDK, NDK und Build-Tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client-app/src-tauri -> target

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Editor-Bausteine bauen
        run: pnpm --filter @docmost/editor-ext build

      - name: Android-Projekt erzeugen
        working-directory: apps/client-app
        run: |
          pnpm tauri android init --ci
          pnpm tauri icon src-tauri/icons/icon.png

      - name: APK bauen
        working-directory: apps/client-app
        run: pnpm tauri android build --apk --ci

      - name: APK signieren
        working-directory: apps/client-app
        env:
          KEYSTORE_B64: ${{ secrets.LT4_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.LT4_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LT4_ANDROID_KEY_ALIAS }}
        run: |
          set -e
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -n 1)
          test -n "$UNSIGNED"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lt4.jks"
            PASS="$KEYSTORE_PASSWORD"; ALIAS="${KEY_ALIAS:-lt4docs}"
          else
            echo "::warning::Kein Schlüssel hinterlegt (Secret LT4_ANDROID_KEYSTORE). Die APK ist mit einem Einmal-Schlüssel signiert: Updates lassen sich nicht drüber installieren. Siehe docs/lt4/client-app.md."
            keytool -genkeypair -keystore "$RUNNER_TEMP/lt4.jks" -storepass lt4docs-test -keypass lt4docs-test \
              -alias lt4docs -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LT4-Docs Test"
            PASS=lt4docs-test; ALIAS=lt4docs
          fi
          TOOLS="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist-apk
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/lt4.jks" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --ks-key-alias "$ALIAS" --out "dist-apk/LT4-Docs_${VERSION}.apk" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify "dist-apk/LT4-Docs_${VERSION}.apk"
          rm -f "$RUNNER_TEMP/lt4.jks"

      - name: Dateien hochladen
        uses: actions/upload-artifact@v4
        with:
          name: lt4-docs-android
          if-no-files-found: error
          path: apps/client-app/dist-apk/*.apk

      - name: Release-Entwurf
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: LT4-Docs Client ${{ github.ref_name }}
          files: apps/client-app/dist-apk/*.apk
