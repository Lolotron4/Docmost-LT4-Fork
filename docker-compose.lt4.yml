# LT4-Fork: Test-/Betriebsstack, der das Image aus diesem Repository baut.
# In Portainer: Stacks -> Add stack -> Repository, Compose-Pfad "docker-compose.lt4.yml".
# Variablen (in Portainer unter "Environment variables" setzen):
#   APP_SECRET   Pflicht, mindestens 32 Zeichen
#   DB_PASSWORD  Pflicht
#   APP_URL      Adresse, unter der Docmost erreichbar ist (Standard: http://localhost:3000)
#   LT4_PORT     Port auf dem Host (Standard: 3000)
services:
  docmost:
    build: .
    image: docmost-lt4:local
    depends_on:
      - db
      - redis
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt}
      DATABASE_URL: postgresql://docmost:${DB_PASSWORD:?DB_PASSWORD fehlt}@db:5432/docmost
      REDIS_URL: redis://redis:6379
    ports:
      - "${LT4_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - lt4_storage:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
    restart: unless-stopped
    volumes:
      - lt4_db:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - lt4_redis:/data

volumes:
  lt4_storage:
  lt4_db:
  lt4_redis:
