# LT4-Fork: Stack, der das Image aus diesem Repository baut.
# In Portainer: Stacks -> Add stack -> Repository, Compose-Pfad "docker-compose.lt4.yml".
#
# Variablen (in Portainer unter "Environment variables"):
#   APP_SECRET     Pflicht, mindestens 32 Zeichen
#   DB_PASSWORD    Pflicht
#   APP_URL        Öffentliche Adresse, z. B. https://docs.example.de
#   DATA_DIR       Ordner auf dem Host für alle Daten (Standard: ./lt4-data)
#                  ACHTUNG: Für einen Test nie den Ordner einer laufenden Instanz verwenden!
#   PROXY_NETWORK  Externes Netzwerk des Reverse-Proxys (Standard: npm-proxy-network)
#   POSTGRES_IMAGE Postgres-Image (Standard: postgres:18)
#   FILE_UPLOAD_SIZE_LIMIT / FILE_IMPORT_SIZE_LIMIT  z. B. 500mb / 800mb
#
# Docmost ist nur über den Reverse-Proxy erreichbar (Port 3000 im Proxy-Netzwerk,
# kein Port auf dem Host). Im Nginx Proxy Manager als Ziel "docmost-lt4" Port 3000 eintragen.
services:
  docmost:
    build: .
    image: docmost-lt4:local
    container_name: ${CONTAINER_NAME:-docmost-lt4}
    depends_on:
      - db
      - redis
    environment:
      APP_URL: ${APP_URL:?APP_URL fehlt}
      APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt}
      DATABASE_URL: postgresql://docmost:${DB_PASSWORD:?DB_PASSWORD fehlt}@db:5432/docmost
      REDIS_URL: redis://redis:6379
      FILE_UPLOAD_SIZE_LIMIT: ${FILE_UPLOAD_SIZE_LIMIT:-50mb}
      FILE_IMPORT_SIZE_LIMIT: ${FILE_IMPORT_SIZE_LIMIT:-200mb}
    expose:
      - "3000"
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./lt4-data}/docmost:/app/data/storage
    networks:
      - docmost-network
      - proxy

  db:
    image: ${POSTGRES_IMAGE:-postgres:18}
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./lt4-data}/db_data:/var/lib/postgresql
    networks:
      - docmost-network

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./lt4-data}/redis_data:/data
    networks:
      - docmost-network

networks:
  docmost-network:
  proxy:
    name: ${PROXY_NETWORK:-npm-proxy-network}
    external: true
